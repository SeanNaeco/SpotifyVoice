name: Build APK

# Builds a debug APK on every push, and whenever you hit "Run workflow".
# GitHub's runners can reach Google's Maven servers, which is what makes this
# work without installing anything on your own machine.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android action here on purpose. The runner image already ships
      # the Android SDK (API 35, build-tools 35.0.0) at $ANDROID_HOME, and the
      # action that used to be here — android-actions/setup-android@v3 — is a
      # Node 20 action that fails on the current runners.
      - name: Confirm the Android SDK is present
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # The offline speech model is ~40 MB, so it is fetched here rather than
      # committed to the repo. It ends up inside the APK, so the finished app
      # still needs no network for wake-word detection.
      - name: Fetch the Vosk speech model
        run: |
          set -euo pipefail
          MODEL=vosk-model-small-en-us-0.15
          curl -fSL -o model.zip "https://alphacephei.com/vosk/models/${MODEL}.zip"
          unzip -q model.zip
          DEST=app/src/main/assets/model-en-us
          mkdir -p "$DEST"
          mv "$MODEL"/* "$DEST"/
          # Vosk re-unpacks from assets only when this marker changes.
          date +%s > "$DEST/uuid"
          rm -rf model.zip "$MODEL"
          echo "Model staged:"; du -sh "$DEST"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Uses the Gradle installed above rather than ./gradlew, so the build
      # works even if the wrapper jar never made it into the repo.
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name the APK something recognisable
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/VoiceDJ-${GITHUB_RUN_NUMBER}.apk"
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceDJ-apk
          path: out/*.apk
          retention-days: 90

      # A release makes the APK downloadable straight from the phone browser,
      # which an Actions artifact is not.
      - name: Publish a release you can download on the phone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VoiceDJ build ${{ github.run_number }}
          files: out/*.apk
          body: |
            Debug build of VoiceDJ.

            On your phone: tap the .apk below, then allow "install unknown apps"
            for your browser when prompted.
